<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#05060f" />
<title>StarBreaker: Unlimited Drill</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="game"></canvas>

    <div id="overlay">
      <div class="topbar">
        <span class="coin" title="寶石"><i>💎</i><b id="resGems">0</b></span>
        <div class="credits">
          <div class="cr"><b id="resGold">0</b><span>CR</span></div>
          <div class="mult" id="resMult">×1.00</div>
        </div>
        <div class="planetbox">
          <canvas id="planetThumb" width="46" height="46"></canvas>
          <div class="pinfo">
            <span id="galaxyLabel">Galaxy 1</span>
            <span id="planetLabel">Planet 1</span>
            <b id="blocksLeft">0/0</b>
          </div>
        </div>
      </div>

      <div class="rail">
        <button data-tab="settings" title="設定">⚙</button>
        <button data-tab="sats" title="衛星">🛰<span class="badge" data-badge="sats"></span></button>
        <button data-tab="skills" title="技能">🎲<span class="badge" data-badge="skills"></span></button>
        <button data-tab="pass" title="通行證">🎫<span class="badge" data-badge="pass"></span></button>
        <button data-tab="bundles" title="禮包">🎁</button>
        <button data-tab="save" title="存檔">💾</button>
      </div>

      <button class="aim" id="btnAim" title="切換鎖定目標">🎯<span id="aimLabel">最近</span></button>
      <button id="verBadge" class="ver-badge" type="button" aria-label="版本資訊">v—</button>
      <div id="fpsBox"><span id="fpsLabel">60 fps</span></div>
    </div>
  </div>

  <div id="ui-layer">
    <div class="bottom" id="bottom"></div>
  </div>

  <div id="modal" class="modal hidden">
    <div class="modal-card">
      <div class="modal-head">
        <h2 id="modalTitle">Title</h2>
        <button id="modalClose">✕</button>
      </div>
      <div id="modalBody" class="modal-body"></div>
    </div>
  </div>
  <div id="toast" class="toast hidden"></div>
</div>

<script src="js/big.js"></script>
<script src="js/config.js"></script>
<script src="js/state.js"></script>
<script src="js/planet.js"></script>
<script src="js/game.js"></script>
<script src="js/ui.js"></script>
</body>
</html>
